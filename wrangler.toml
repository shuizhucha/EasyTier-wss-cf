name = "easytier-wss-cf"
main = "src/worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
WS_PATH = "ws"
EASYTIER_DISABLE_RELAY = "0"
EASYTIER_COMPRESS_RPC = "1"
LOCATION_HINT = "apac"

[durable_objects]
bindings = [
  { name = "RELAY_ROOM", class_name = "RelayRoom" }
]

# 核心修改点：这里只告诉 Cloudflare 全新创建一个 RelayRoom
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RelayRoom"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
